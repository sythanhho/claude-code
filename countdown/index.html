<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Counting my heartbeats</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fde8f0 0%, #fbb6ce 40%, #f9a8d4 70%, #fce7f3 100%);
      font-family: 'Lato', sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* ── Floating hearts ── */
    .hearts-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .heart {
      position: absolute;
      bottom: -60px;
      animation: floatUp linear infinite;
      opacity: 0;
    }

    .heart::before,
    .heart::after {
      content: '';
      position: absolute;
      background: inherit;
      border-radius: 50% 50% 0 0;
    }

    /* SVG hearts are simpler — use unicode hearts with colour */
    .heart span {
      display: block;
      color: inherit;
      line-height: 1;
      user-select: none;
    }

    @keyframes floatUp {
      0%   { transform: translateY(0)   rotate(0deg)   scale(1);   opacity: 0; }
      10%  { opacity: 0.7; }
      80%  { opacity: 0.5; }
      100% { transform: translateY(-110vh) rotate(25deg) scale(0.8); opacity: 0; }
    }

    /* ── Main card ── */
    .card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid rgba(255, 182, 210, 0.6);
      border-radius: 28px;
      padding: clamp(2rem, 6vw, 4rem) clamp(1.5rem, 8vw, 5rem);
      max-width: min(680px, 92vw);
      width: 100%;
      text-align: center;
      box-shadow:
        0 8px 32px rgba(249, 168, 212, 0.35),
        0 2px 8px rgba(255, 182, 210, 0.2);
    }

    .tagline {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(1.25rem, 4vw, 2rem);
      color: #be185d;
      line-height: 1.4;
      margin-bottom: 2.5rem;
      text-shadow: 0 1px 3px rgba(190, 24, 93, 0.15);
    }

    /* ── Countdown grid ── */
    .countdown {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(0.5rem, 2vw, 1.25rem);
      margin-bottom: 2rem;
    }

    .unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .unit .number {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.4rem, 9vw, 4.5rem);
      font-weight: 600;
      color: #9d174d;
      line-height: 1;
      min-width: 2ch;
      text-align: center;
      transform-origin: center bottom;
      transition: transform 0.15s ease;
    }

    .unit .number.bump {
      transform: scale(1.12);
    }

    .unit .label {
      font-size: clamp(0.65rem, 2vw, 0.8rem);
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #db2777;
      margin-top: 0.4rem;
    }

    .separator {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 7vw, 3.8rem);
      font-weight: 600;
      color: #f9a8d4;
      align-self: flex-start;
      padding-top: 0.1em;
      line-height: 1;
    }

    /* ── Arrival date ── */
    .arrival {
      font-size: clamp(0.75rem, 2.2vw, 0.9rem);
      color: #be185d;
      opacity: 0.7;
      letter-spacing: 0.05em;
    }

    /* ── Arrived message ── */
    .arrived-msg {
      display: none;
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.6rem, 5vw, 2.6rem);
      font-style: italic;
      color: #be185d;
      line-height: 1.4;
    }

    /* ── Small heart decoration ── */
    .deco-hearts {
      font-size: 1.2rem;
      color: #f9a8d4;
      margin-bottom: 1.2rem;
      letter-spacing: 0.4em;
    }
  </style>
</head>
<body>

  <div class="hearts-container" id="heartsContainer"></div>

  <div class="card">
    <div class="deco-hearts">♥ ♥ ♥</div>
    <p class="tagline">Counting my heartbeats<br/>till you come back to me</p>

    <div class="countdown" id="countdown">
      <div class="unit">
        <span class="number" id="days">--</span>
        <span class="label">Days</span>
      </div>
      <div class="unit">
        <span class="number" id="hours">--</span>
        <span class="label">Hours</span>
      </div>
      <div class="unit">
        <span class="number" id="minutes">--</span>
        <span class="label">Minutes</span>
      </div>
      <div class="unit">
        <span class="number" id="seconds">--</span>
        <span class="label">Seconds</span>
      </div>
    </div>

    <p class="arrival">June 27th · 13:05 · Paris CDG ✈</p>

    <p class="arrived-msg" id="arrivedMsg">She's here ♥<br/>Welcome back, my love.</p>
  </div>

  <script>
    // Target: June 27 2026, 13:05 Paris time (CEST = UTC+2)
    const TARGET = new Date('2026-06-27T11:05:00Z');

    const $ = id => document.getElementById(id);
    const els = {
      days:    $('days'),
      hours:   $('hours'),
      minutes: $('minutes'),
      seconds: $('seconds'),
    };

    function pad(n) { return String(n).padStart(2, '0'); }

    function bump(el) {
      el.classList.remove('bump');
      void el.offsetWidth; // reflow
      el.classList.add('bump');
    }

    let prevSeconds = -1;
    let prevMinutes = -1;

    function tick() {
      const now  = new Date();
      const diff = TARGET - now;

      if (diff <= 0) {
        $('countdown').style.display = 'none';
        $('arrivedMsg').style.display = 'block';
        return;
      }

      const d = Math.floor(diff / 864e5);
      const h = Math.floor((diff % 864e5) / 36e5);
      const m = Math.floor((diff % 36e5)  / 6e4);
      const s = Math.floor((diff % 6e4)   / 1e3);

      els.days.textContent    = pad(d);
      els.hours.textContent   = pad(h);
      els.minutes.textContent = pad(m);

      if (s !== prevSeconds) {
        els.seconds.textContent = pad(s);
        bump(els.seconds);
        prevSeconds = s;
      }
      if (m !== prevMinutes) {
        bump(els.minutes);
        prevMinutes = m;
      }
    }

    setInterval(tick, 500);
    tick();

    // ── Generate floating hearts ──
    const HEART_CHARS = ['♥', '♡', '❤', '💕', '💗', '💖'];
    const COLORS = [
      '#f9a8d4', '#fbb6ce', '#fbcfe8', '#f472b6',
      '#ec4899', '#db2777', '#be185d', '#ff91b8',
    ];
    const container = $('heartsContainer');
    const COUNT = 28;

    for (let i = 0; i < COUNT; i++) {
      const heart = document.createElement('div');
      heart.className = 'heart';

      const size   = 10 + Math.random() * 28;        // 10–38px
      const left   = Math.random() * 100;             // % across
      const delay  = Math.random() * 14;              // stagger
      const dur    = 8 + Math.random() * 12;          // 8–20s
      const color  = COLORS[Math.floor(Math.random() * COLORS.length)];
      const char   = HEART_CHARS[Math.floor(Math.random() * HEART_CHARS.length)];

      heart.style.cssText = `
        left: ${left}%;
        font-size: ${size}px;
        color: ${color};
        animation-duration: ${dur}s;
        animation-delay: ${delay}s;
        filter: drop-shadow(0 0 ${Math.round(size * 0.3)}px ${color}88);
      `;

      const span = document.createElement('span');
      span.textContent = char;
      heart.appendChild(span);
      container.appendChild(heart);
    }
  </script>
</body>
</html>
